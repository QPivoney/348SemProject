<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CourtHub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --surface2:  #1a1a1a;
      --border:    #2a2a2a;
      --orange:    #f97316;
      --orange-dim:#7c3910;
      --text:      #e8e8e8;
      --muted:     #666;
      --green:     #22c55e;
      --red:       #ef4444;
      --blue:      #3b82f6;
      --radius:    8px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0 2rem;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      color: var(--orange);
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo span { color: var(--text); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--text);
      border-bottom-color: var(--orange);
    }

    /* ── Layout ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 2rem 4rem;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Page header ── */
    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
    }

    .page-header h1 span { color: var(--orange); }

    .page-header p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: var(--orange);
      margin-bottom: 1.25rem;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius);
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover   { opacity: 0.85; }
    .btn:active  { transform: scale(0.97); }

    .btn-primary  { background: var(--orange);  color: #000; }
    .btn-danger   { background: var(--red);     color: #fff; }
    .btn-ghost    { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm       { padding: 0.3rem 0.75rem; font-size: 0.8rem; }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input, select, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      padding: 0.6rem 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--orange);
    }

    select option { background: var(--surface2); }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-group { display: flex; flex-direction: column; }

    /* Multi-select */
    select[multiple] {
      height: 120px;
      padding: 0.5rem;
    }

    select[multiple] option {
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
    }

    select[multiple] option:checked {
      background: var(--orange-dim);
      color: var(--orange);
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      text-align: left;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 0.75rem 1rem;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .badge-pickup   { background: #1e3a5f; color: #60a5fa; }
    .badge-league   { background: #1a2e1a; color: #4ade80; }
    .badge-practice { background: #2d1f00; color: #fbbf24; }
    .badge-indoor   { background: #1e1e3a; color: #a78bfa; }
    .badge-outdoor  { background: #1a2e1a; color: #34d399; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeUp 0.25s ease both;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: var(--orange);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.2rem;
      transition: color 0.15s;
    }

    .modal-close:hover { color: var(--text); }

    .modal-footer {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 999;
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    #toast.show { transform: translateY(0); }
    #toast.success { border-left: 3px solid var(--green); }
    #toast.error   { border-left: 3px solid var(--red);   }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .tab {
      padding: 0.6rem 1.25rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: -1px;
    }

    .tab:hover  { color: var(--text); }
    .tab.active { color: var(--orange); border-bottom-color: var(--orange); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Utilities ── */
    .flex          { display: flex; }
    .items-center  { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2         { gap: 0.5rem; }
    .gap-3         { gap: 0.75rem; }
    .mb-4          { margin-bottom: 1rem; }
    .mb-6          { margin-bottom: 1.5rem; }
    .text-muted    { color: var(--muted); }
    .text-orange   { color: var(--orange); }
    .text-sm       { font-size: 0.85rem; }
    .font-mono     { font-family: 'DM Mono', monospace; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }

    /* Stat pills */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }

    .stat-pill .label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .stat-pill .value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.02em;
      color: var(--orange);
      line-height: 1;
    }

    .stat-pill .unit {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/"><span>Court</span>HUB</a>
  <a href="/courts" {% if request.path == '/courts' %}class="active"{% endif %}>Courts & Sessions</a>
  <a href="/report" {% if request.path == '/report' %}class="active"{% endif %}>Report</a>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<div id="toast"></div>

<script>
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = (type === 'success' ? '✓  ' : '✕  ') + msg;
    el.className = `show ${type}`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = '', 2800);
  }

  function initTabs(container) {
    const tabs   = container.querySelectorAll('.tab');
    const panels = container.querySelectorAll('.tab-panel');
    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        panels[i].classList.add('active');
      });
    });
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
